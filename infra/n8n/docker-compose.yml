services:
  postgres:
    image: postgres:15-alpine
    container_name: security_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-security_scans}
      - POSTGRES_USER=${POSTGRES_USER:-n8n_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cPU3MX00cQED7Vc4rlo6Df9B}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../../db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - greenbone_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_user} -d ${POSTGRES_DB:-security_scans}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    user: root
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - ~/.n8n:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/local/bin/docker:ro
      - ../../scripts:/scripts:ro
      - /tmp:/tmp
    environment:
      - N8N_USER_FOLDER=/home/node
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Mendoza}
      - TZ=${TZ:-America/Argentina/Mendoza}
      - EXECUTIONS_TIMEOUT=-1
    networks:
      - greenbone_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  greenbone_net:
    external: true
    name: greenbone-community-edition_default

