services:
  postgres:
    image: postgres:15-alpine
    container_name: security_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-security_scans}
      - POSTGRES_USER=${POSTGRES_USER:-n8n_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerida}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ../../db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - greenbone_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n_user} -d ${POSTGRES_DB:-security_scans}"]
      interval: 5s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:2.10.4@sha256:4dfbc931452471c15a760b987711d37364470344db47f1546f98402728e77612
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - ~/.n8n:/home/node/.n8n
      - ../../scripts:/scripts:ro
      - /tmp:/tmp
    environment:
      - N8N_USER_FOLDER=/home/node
      - N8N_COMMUNITY_PACKAGES_ENABLED=true
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Argentina/Mendoza}
      - TZ=${TZ:-America/Argentina/Mendoza}
      - EXECUTIONS_TIMEOUT=-1
    networks:
      - greenbone_net
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  greenbone_net:
    external: true
    name: greenbone-community-edition_default

